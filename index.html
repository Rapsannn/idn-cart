<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="src/style.css" />
    <title>Document</title>

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Header -->
    <header class="shadow-sm py-4 bg-white">
      <div class="container flex items-center justify-between">
        <!-- logo -->
        <a href="/index.html">
          <img src="public/images/logo.svg" alt="" />
        </a>

        <!-- search bar -->
        <div class="w-full flex max-w-xl relative">
          <span class="absolute left-4 top-3 text-lg text-gray-400">
            <i class="fa-solid fa-magnifying-glass"></i>
          </span>
          <input
            class="border w-full border-primary border-r-0 py-3 pl-12 pr-3 rounded-l-md focus:outline-none"
            type="text"
            placeholder="Search"
          />
          <button
            class="bg-primary px-8 text-white rounded-r-md hover:bg-white hover:text-primary border border-primary"
          >
            Search
          </button>
        </div>

        <!-- icons -->
        <div class="flex space-x-4">
          <a
            href=""
            class="text-gray-700 text-center hover:text-primary transition relative"
          >
            <div class="text-2xl">
              <i class="fa-regular fa-heart"></i>
            </div>
            <div class="text-xs leading-3">Wishlist</div>
            <span
              class="absolute bg-primary rounded-full text-white flex items-center justify-center w-5 h-5 right-0 -top-1"
              >8</span
            >
          </a>
          <a
            href=""
            class="text-gray-700 text-center hover:text-primary transition relative"
          >
            <div class="text-2xl">
              <i class="fa-solid fa-cart-shopping"></i>
            </div>
            <div class="text-xs leading-3">Cart</div>
            <span
              class="absolute bg-primary rounded-full text-white flex items-center justify-center w-5 h-5 -right-1 -top-1"
              >8</span
            >
          </a>
          <a
            href=""
            class="text-gray-700 text-center hover:text-primary transition relative"
          >
            <div class="text-2xl">
              <i class="fa-solid fa-circle-user"></i>
            </div>
            <div class="text-xs leading-3">User</div>
          </a>
        </div>
      </div>
    </header>
    <!-- Header End -->

    <!-- Navbar -->
    <nav class="bg-gray-800">
      <div class="container flex">

        <!-- all categories -->
        <div
          class="bg-primary flex items-center px-8 py-4 text-white cursor-pointer relative group"
        >
          <span class="mr-2">
            <i class="fa-solid fa-bars"></i>
          </span>
          <span class="capitalize">All Categories</span>
        <!-- dropdown -->
         <div class="bg-white py-3 absolute w-full top-full left-0 shadow divide-y divide-gray-200 group-hover:opacity-100 opacity-0 duration-300 invisible group-hover:visible">
          <!-- singgle categories -->
          <a href="" class="flex px-6 py-3 hover:bg-gray-100 transition">
            <img class="w-5 h-5 object-contain" src="public/images/icons/sofa.svg" alt="">
            <span class="text-gray-600 text-sm capitalize">sofia</span>
          </a>
          <!-- singgle categories end -->
          <!-- singgle categories -->
          <a href="" class="flex px-6 py-3 hover:bg-gray-100 transition">
            <img class="w-5 h-5 object-contain" src="public/images/icons/bed.svg" alt="">
            <span class="text-gray-600 text-sm capitalize">bedroom</span>
          </a>
          <!-- singgle categories end -->
          <!-- singgle categories -->
          <a href="" class="flex px-6 py-3 hover:bg-gray-100 transition">
            <img class="w-5 h-5 object-contain" src="public/images/icons/office.svg" alt="">
            <span class="text-gray-600 text-sm capitalize">offfice</span>
          </a>
          <!-- singgle categories end -->
          <!-- singgle categories -->
          <a href="" class="flex px-6 py-3 hover:bg-gray-100 transition">
            <img class="w-5 h-5 object-contain" src="public/images/icons/terrace.svg" alt="">
            <span class="text-gray-600 text-sm capitalize">outdoor</span>
          </a>
          <!-- singgle categories end -->
          <!-- singgle categories -->
          <a href="" class="flex px-6 py-3 hover:bg-gray-100 transition">
            <img class="w-5 h-5 object-contain" src="public/images/icons/bed-2.svg" alt="">
            <span class="text-gray-600 text-sm capitalize">mattress</span>
          </a>
          <!-- singgle categories end -->
          <!-- singgle categories -->
          <a href="" class="flex px-6 py-3 hover:bg-gray-100 transition">
            <img class="w-5 h-5 object-contain" src="public/images/icons/restaurant.svg" alt="">
            <span class="text-gray-600 text-sm capitalize">dining</span>
          </a>
          <!-- singgle categories end -->
         </div>
        
        </div>
        <!-- all categories end -->

        <!-- nav links -->
        <div class="flex items-center justify-between flex-grow pl-12">
          <div class="space-x-6">
            <a class="text-gray-300 hover:text-white" href="">Home</a>
            <a class="text-gray-300 hover:text-white" href="">Shop</a>
            <a class="text-gray-300 hover:text-white" href="">About Us</a>
            <a class="text-gray-300 hover:text-white" href="">Contact Us</a>
          </div>
          <div class="space-x-6">
            <a class="text-gray-300 hover:text-white" href="">Login</a>
            <a class="text-gray-300 hover:text-white" href="">Register</a>
          </div>
        </div>
        <!-- nav links end -->

        

      </div>
    </nav>
    <!-- Navbar End -->
  </body>
</html>
